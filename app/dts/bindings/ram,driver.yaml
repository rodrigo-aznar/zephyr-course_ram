description: custom driver for lesson 6 homework
compatible: "ram,driver"
include: base.yaml
properties:
  calibration:
    type: int
    required: false
    description: Calibration value for the sensor
  gpios:
    type: phandle-array
    required: true
    description: GPIO spec for LED controlling
  default-sleep-ms:
    type: int
    required: true
    description: Default duration for k_msleep (in ms) to return from calls to turn On/Off in the driver    
  sleep-ms:
    type: int
    required: true
    description: Duration for k_msleep (in ms) to return from calls to turn On/Off in the driver    